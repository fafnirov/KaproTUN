name: Build & release KaproTUN

# Auto-builds on every vX.Y.Z tag push for all three desktop OSes
# (macOS twice: Apple Silicon and Intel).
# The matrix runs in parallel; each job produces its own artifact and
# uploads to the same GitHub Release for the tag.
on:
  workflow_dispatch:

permissions:
  contents: write  # needed to upload release assets

jobs:
  smoke-test:
    # Gates the matrix build. If smoke fails, NOTHING ships — saves
    # users from downloading a broken release. ~1 minute overhead per
    # release.
    name: Pre-release smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.2.2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Qt runtime deps
        # PySide6 imports work but Qt platform plugin needs xcb stack
        # even in offscreen mode on some images. Same set as the
        # ubuntu-latest build job needs.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Run smoke test
        env:
          # Headless Qt — no display server on the runner.
          QT_QPA_PLATFORM: offscreen
        # -u and faulthandler: when the suite dies in native code (a Qt
        # abort, a segfault) the log otherwise stops a screenful early and
        # names no test.
        run: |
          python -u -X faulthandler -m kapro_tun.scripts.smoke_test
          python -m unittest kapro_tun.scripts.test_windows_startup kapro_tun.scripts.test_window_lifecycle -q

  build:
    name: Build (${{ matrix.os }})
    # Builds run only if smoke passes — a single failing import
    # gates ALL three OS builds from publishing.
    needs: smoke-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # one OS failing shouldn't block the others
      matrix:
        include:
          - os: macos-15
            artifact_name: KaproTUN-macOS-arm64.dmg
            # macos-15 is Apple Silicon (M-series). The script builds the
            # .app and wraps it in a .dmg users drag into /Applications, then
            # refuses to continue if the binary is not the expected arch.
            build_cmd: bash packaging/build-macos-dmg.sh KaproTUN-macOS-arm64.dmg arm64
            payload_path: dist/KaproTUN-macOS-arm64.dmg
            shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux system deps (xcb, etc.)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Qt6 wants these at runtime — PySide6 wheel doesn't include
          # the X11/wayland platform plugins' system dependencies.
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            wget fuse libfuse2

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build payload
        run: ${{ matrix.build_cmd }}

      # The suite above runs the source, on Linux. This runs the application
      # that was just packaged, on the platform it was packaged for, and lets
      # it check itself: TLS, the engine, the window, and on macOS a whole
      # proxy-mode connection through a server on the loopback.
      - name: Self-test the built application
        run: python packaging/run_selftest.py selftest-out

      - name: Upload self-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ matrix.artifact_name }}-${{ github.sha }}
          path: selftest-out
          if-no-files-found: warn

      - name: Show built artifacts
        if: matrix.os == 'windows-latest'
        run: Get-ChildItem dist/ | Format-Table Name, Length

      - name: Show built artifacts (unix)
        if: matrix.os != 'windows-latest'
        run: ls -lh dist/

      - name: Upload artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: ${{ matrix.payload_path }}
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # CHANGELOG.md has two `# ` sections — `# Android` (entries from
          # the parallel Android codebase) and `# Desktop (...)` (entries
          # from this workflow's builds). Take the top-most `## ` section
          # INSIDE the Desktop block — otherwise our v1.10.x desktop tag
          # would publish with the Android v0.1.0 description, which is
          # exactly what bit us in v1.10.0 → v1.10.2.
          awk '
            /^# Desktop/    { in_desktop=1; next }
            /^# /           { if (in_desktop) exit }
            !in_desktop     { next }
            /^## /          { if (found) exit; found=1; next }
            /^---$/         { if (found) exit }
            found           { print }
          ' CHANGELOG.md > /tmp/release-body-top.md

          # Append the static "how to download" table after the
          # per-release notes — same for every release.
          cat >> /tmp/release-body-top.md <<'EOF'

          ---

          ### ⬇ Скачать (выбери под свою систему)

          | OS | Файл | Что делать |
          |----|------|-----------|
          | Windows 10/11 (x64) | `KaproTUN-Setup.exe` | Запустить, пара кликов |
          | macOS (Apple Silicon) | `KaproTUN-macOS-arm64.dmg` | Открыть DMG, перетащить в Applications |
          | macOS (Intel) | `KaproTUN-macOS-x64.dmg` | Открыть DMG, перетащить в Applications |
          | Linux (x64) | `KaproTUN-Linux-x64.AppImage` | `chmod +x` и запустить |

          **macOS не даёт открыть приложение?** У него нет платной подписи Apple.
          Поставь одной командой в Терминале, без предупреждения и без пароля:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/fafnirov/KaproTUN/main/packaging/install-macos.sh | bash
          ```

          Или разреши вручную: «Системные настройки» → «Конфиденциальность и
          безопасность» → «Всё равно открыть».

          Полный changelog: [CHANGELOG.md](../../blob/main/CHANGELOG.md)

          ---

          Auto-built by GitHub Actions from `${{ github.ref_name }}`.
          EOF

          echo "=== Release body preview ==="
          cat /tmp/release-body-top.md

      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.payload_path }}
          generate_release_notes: true
          # Each matrix job runs this — but only ubuntu-latest extracted
          # the body file. softprops accepts a body_path that doesn't
          # exist (treats as empty) so windows/macos jobs just attach
          # files without touching the body — ubuntu-latest set it once.
          body_path: /tmp/release-body-top.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
